map $http_x_forwarded_proto $forwarded_proto_is_http {
  http 1;
  default 0;
}

map $http_x_forwarded_proto $forwarded_proto_is_set {
  "" 0;
  default 1;
}

map $host $is_local_host {
  localhost 1;
  127.0.0.1 1;
  default 0;
}

map "$forwarded_proto_is_http:$forwarded_proto_is_set:$scheme:$is_local_host" $redirect_to_https {
  "1:1:http:0" 1;
  "0:0:http:0" 1;
  default 0;
}

server {
  listen 80;
  server_name rabybayharbour.com.au www.rabybayharbour.com.au localhost 127.0.0.1 _;

  if ($redirect_to_https) {
    return 301 https://rabybayharbour.com.au$request_uri;
  }

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://rabybayharbour.com.au data:; frame-src https://www.google.com; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

  location ~ /\.(?!well-known) {
    return 404;
  }

  location ~* ^/(?:Dockerfile|dockerfile|package(?:-lock)?\.json|nginx\.conf|vite\.config\.[cm]?js|src/|node_modules/|\.env) {
    return 404;
  }

  location ~* ^/(?:api|admin|upload|uploads|graphql|server-status|actuator|debug|wp-admin|wp-login\.php)(?:/|$) {
    return 404;
  }

  location ~* ^/(?:var/run/docker\.sock|docker\.sock|run/docker\.sock)(?:/|$) {
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://rabybayharbour.com.au data:; frame-src https://www.google.com; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
    try_files $uri =404;
  }
}
